[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feyagate-skill"
version = "1.2.23"
description = "MCP Smart Home Gateway for AI Agents - Control Xiaomi, Tuya, Midea, eWeLink devices via MCP protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "panzuji", email = "598432467@qq.com"},
]
keywords = ["mcp", "smart-home", "iot", "xiaomi", "tuya", "midea", "ewelink", "ai-agent", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://www.feyagate.com"
Repository = "https://github.com/toddpan/feyagate-skill"
Documentation = "https://github.com/toddpan/feyagate-skill#readme"

[project.scripts]
feyagate = "feyagate_skill.cli:main"

[tool.setuptools.packages.find]
include = ["feyagate_skill*"]

[tool.setuptools.package-data]
feyagate_skill = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
